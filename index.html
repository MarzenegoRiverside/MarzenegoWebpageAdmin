<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marzenego Riverside</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a2a12">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ac:#F4C430;--tx:#EEF3E8;--g:#1E7A3A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#000;min-height:100%}body{min-height:100vh;background:transparent;color:var(--tx);font-family:'Manrope',sans-serif}
.bg{position:fixed;inset:0;z-index:-1;background:
 radial-gradient(circle at 50% -8%,#1E7A3A 0,transparent 52%),
 radial-gradient(circle at 105% 28%,rgba(46,140,60,.85) 0,transparent 45%),
 radial-gradient(circle at -5% 38%,color-mix(in srgb,var(--ac) 70%,transparent) 0,transparent 48%),
 radial-gradient(circle at 10% 82%,rgba(30,122,58,.75) 0,transparent 50%),#000;transition:background .4s}
#app{max-width:430px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.brand{line-height:.8}.brand b{display:block;font-size:36px;font-weight:700;color:var(--tx)}
.brand i{display:block;font-family:'Alex Brush',cursive;font-style:normal;font-size:36px;color:var(--ac);margin-top:-4px}
.glass{background:linear-gradient(150deg,rgba(255,255,255,.2),rgba(255,255,255,.05));backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 24px rgba(0,0,0,.25)}
.usr{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer;color:#fff;overflow:hidden;font:600 20px 'Manrope'}
.usr svg{width:28px;height:28px}.usr.lgd{background:var(--ac);color:#fff}.usr img{width:100%;height:100%;object-fit:cover}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px 0 14px;padding:2px}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:none;border:1px solid transparent;border-radius:20px;color:var(--tx);opacity:.6;font:400 19px 'Manrope';padding:4px 14px;cursor:pointer;white-space:nowrap}
nav button.on{opacity:1;font-weight:600;background:linear-gradient(150deg,rgba(255,255,255,.25),rgba(255,255,255,.06));border-color:rgba(255,255,255,.35)}
.stack{position:relative;padding-bottom:40px;margin-bottom:14px}
.stack.nb{padding-bottom:0}
.back{position:absolute;inset:0;border-radius:34px;background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);display:flex;align-items:flex-end;padding:0 24px 9px}
.stack.tp{padding:30px 0 0}.stack.tp .back{align-items:flex-start;padding:8px 22px 0}
.nx{font-size:14px;font-weight:300;text-decoration:underline;opacity:.8}.lab{font-size:12px;font-weight:300;letter-spacing:.3px;opacity:.75;text-transform:none}
.front{position:relative;border-radius:34px}
.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:34px}
.sl::-webkit-scrollbar{display:none}
.sl>section{flex:0 0 100%;scroll-snap-align:start;padding:22px 22px 4px;min-height:430px}
.dots{display:flex;gap:8px;justify-content:center;padding:6px 0 14px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12)}.dots i.on{background:var(--ac);border-color:var(--ac)}
.h{display:flex;gap:14px;align-items:center;margin-bottom:18px}.lg{width:64px;height:auto;flex:none}
.t{font-size:32px;font-weight:700;line-height:1.1}.st{font-size:20px;font-weight:400;opacity:.8;margin-top:2px}
.b18{font-size:18px;font-weight:700;line-height:1.35;margin:22px 4px 18px}
.s{font-size:15px;font-weight:700;margin:0 4px 4px}.li{font-size:15px;font-weight:300;opacity:.9;margin:0 4px 8px}
.row{display:flex;align-items:center;gap:12px;margin:0 4px 14px}.row>div:first-child{flex:1;min-width:0}
.row b{display:block;font-size:17px;font-weight:600}.row span{font-size:16px;font-weight:300;opacity:.85}
.row img{width:84px;height:56px;border-radius:14px;object-fit:cover}
.wl{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:600;flex:none}
.wl.W{color:var(--ac)}.wl.L{color:#ff3b3b}
.wk{display:flex;gap:6px;justify-content:center;padding:14px 12px}
.dy{width:40px;height:56px;border-radius:20px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;opacity:.55}
.dy b{font-weight:400}.dy.on{background:var(--ac);border-color:var(--ac);color:#fff;opacity:1}.dy.on b{font-weight:800}
.lnk{text-decoration:underline;cursor:pointer;font-weight:300;font-size:15px;background:none;border:0;color:var(--tx);font-family:inherit;display:block;margin:0 4px 8px;opacity:.9}
.pill{display:inline-block;border-radius:16px;border:1px solid rgba(255,255,255,.3);background:color-mix(in srgb,var(--ac) 38%,transparent);color:var(--tx);font:600 13px 'Manrope';padding:4px 14px;cursor:pointer;text-align:center}
.pill.off{background:rgba(255,255,255,.06);font-weight:400;opacity:.8}
.pill.ok{background:rgba(30,122,58,.75)}.pill.ko{background:rgba(150,30,30,.8)}.pill.wt{background:rgba(255,255,255,.12)}
.btn{display:block;width:100%;border-radius:22px;border:1px solid rgba(255,255,255,.3);background:color-mix(in srgb,var(--ac) 45%,transparent);color:var(--tx);font:700 17px 'Manrope';padding:12px;cursor:pointer;margin:12px 0}
.in{width:100%;border-radius:22px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:var(--tx);font:400 17px 'Manrope';padding:12px 18px;margin-bottom:10px;outline:0}
.in::placeholder{color:rgba(238,243,232,.6)}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:400;margin:6px 4px;cursor:pointer}
.ck input{appearance:none;width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12)}
.ck input:checked{background:var(--ac);border-color:var(--ac)}
.tg{width:48px;height:20px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);position:relative;flex:none}
.tg i{position:absolute;top:2px;left:3px;width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.5)}
.tc{width:48px;height:20px;border-radius:12px;background:var(--ac);border:0;cursor:pointer}
.cm{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;position:relative}
.cm b{font-size:19px;font-weight:700}.cm .pill{width:28px;padding:1px 0;font-size:16px;border-radius:10px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.c{aspect-ratio:1/1.25;border-radius:11px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);font-size:11px;padding:3px 4px;line-height:1.05;display:flex;flex-direction:column}
.c.o{opacity:.4}.c span{font-weight:400}.c small{font-size:8px;font-weight:600;margin-top:auto;color:#fff}
.c.ev{background:var(--ac);border-color:var(--ac);cursor:pointer;color:#fff}.c.ev span{font-weight:700}
.c.td{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);background:rgba(255,255,255,.22)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:18px}
.mc{width:100%;max-width:394px}.mc .front{padding:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.vt{display:flex;gap:10px;padding:10px 14px}.vt .pill{flex:1;padding:8px;font-size:15px}
.vt .pill.ok.sel{background:#1f7a3a}.vt .pill.ko.sel{background:#9a2424}
.ar{text-align:left}
@media(min-width:700px){#app{padding-top:30px}}
</style>
</head>
<body>
<div class="bg"></div>
<div id="app">
 <header><div class="brand"><b>Marzenego</b><i>Riverside</i></div><button class="usr glass" id="usr" data-a="user"></button></header>
 <nav id="nav"></nav>
 <main id="main"></main>
</div>
<input type="file" id="foto" accept="image/*" hidden>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getFirestore,collection,getDocs,addDoc,doc,setDoc,getDoc,updateDoc,query,where} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyCvqU28XLWRsfJUso0MuS72O2Qxks-MFP0",authDomain:"marzenego-2e266.firebaseapp.com",projectId:"marzenego-2e266",storageBucket:"marzenego-2e266.appspot.com"}));
const $=(s,r=document)=>r.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SK="mzr_session",LOGO="Marzenego.png",LOGOF="https://raw.githubusercontent.com/MarzenegoRiverside/MarzenegoWebpage/refs/heads/main/Marzenego.png";
const TEAM="https://raw.githubusercontent.com/MarzenegoRiverside/MarzenegoWebpage/refs/heads/main/IMG-20251117-WA0030(1).jpg";
const logo=`<img class="lg" src="${LOGO}" onerror="this.onerror=null;this.src='${LOGOF}'">`;
const PAGES=[['home','Home'],['cal','Calendario'],['ev','Prossimi eventi'],['job','Lavora con noi'],['shop','Shop'],['chi','Chi siamo']];
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const GG=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const TEMI=['#F4C430','#1E6BFF','#22FF55','#FF3B3B'];
const S={u:null,uid:null,ud:{},page:'home',prev:'home',D:{eventi:[],novita:[],news:[],risultati:[],eventiExtra:[],posizioni:[],organigramma:[],prodotti:[]},mo:new Date(),shopTab:'Vestiti',names:[],msgs:[],cand:[],ord:[]};
const p2=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const dmy=s=>{const[a,b,c]=s.split('-');return c+'/'+b+'/'+a};
const col=async n=>{try{return(await getDocs(collection(db,n))).docs.map(d=>({id:d.id,...d.data()}))}catch(e){return[]}};
const byData=(a,b)=>String(b.data||'').localeCompare(String(a.data||''));
const user=`<svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c0-4.6 3.8-7.2 8.5-7.2s8.5 2.6 8.5 7.2z"/></svg>`;

async function loadAll(){
 const n=['eventi','novita','news','risultati','eventiExtra','posizioni','organigramma','prodotti'];
 (await Promise.all(n.map(col))).forEach((r,i)=>S.D[n[i]]=r);
 S.D.eventi.sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora));
 await loadUser();
}
async function loadUser(){
 if(!S.u)return;
 const[m,c,o]=await Promise.all([
  getDocs(query(collection(db,"messaggi"),where("destinatario","==",S.u.username))).then(s=>s.docs.map(d=>({id:d.id,...d.data()}))).catch(()=>[]),
  col('candidature'),col('richieste_prodotti')]);
 S.msgs=m.sort((a,b)=>b.timestamp-a.timestamp);
 S.cand=c.filter(x=>x.nome===S.u.nome);S.ord=o.filter(x=>x.nomeUtente===S.u.nome);
}
function setTema(c){document.documentElement.style.setProperty('--ac',c)}
async function applyUser(d,id){
 S.u={username:d.username,nome:d.nome,permissions:d.permissions||null};S.uid=id;S.ud=d;
 if(d.tema)setTema(d.tema);
 await loadUser();
}
function ini(){return(S.u.nome||S.u.username).split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function hdr(){
 const b=$('#usr');
 if(S.u){b.className='usr lgd';b.innerHTML=S.ud.fotoProfilo?`<img src="${S.ud.fotoProfilo}">`:E(ini())}
 else{b.className='usr glass';b.innerHTML=user}
}
function nextEv(){
 const n=new Date(),k=ymd(n)+p2(n.getHours())+':'+p2(n.getMinutes());
 return S.D.eventi.find(e=>(e.data+e.ora)>=k);
}
function sec(){
 const t=new Date(),ne=nextEv();let h='';
 for(let i=-2;i<4;i++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i);h+=`<div class="dy${i?'':' on'}"><b>${'DLMMGVS'[d.getDay()]}</b><span>${p2(d.getDate())}</span></div>`}
 const nt=ne?`${E(ne.tipo)} ${ne.data.slice(8)}/${ne.data.slice(5,7)}`:'nessun evento';
 return `<div class="stack"><div class="back"><span class="nx" style="text-decoration:none">Next: ${nt}</span></div><div class="front glass" style="border-radius:34px"><div class="wk">${h}</div></div></div>`;
}
function stack(sl,o={}){
 S.names=sl.map(s=>s[0]);
 const dots=sl.length>1?`<div class="dots">${sl.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:'<div style="height:14px"></div>';
 return `<div class="stack${o.nb?' nb':''}">${o.nb?'':`<div class="back"><span class="nx">Next: ${E(o.nx||sl[1%sl.length][0])}</span></div>`}<div class="front glass"><div class="sl">${sl.map(s=>`<section>${s[1]}</section>`).join('')}</div>${dots}</div></div>`;
}
const head=(t,s,l=1)=>`<div class="h">${l?logo:''}<div><div class="t">${t}</div>${s?`<div class="st">${s}</div>`:''}</div></div>`;

/* ---------- HOME ---------- */
function vHome(){
 const nv=[...S.D.novita].sort(byData).slice(0,3),nw=[...S.D.news].sort(byData).slice(0,3),rs=[...S.D.risultati].sort(byData).slice(0,3);
 const s1=head('Home Page','Scorri le sezioni')+`<p class="b18">Troverai la nostra sezione dedicata ai risultati, alle news e i collegamenti esterni</p><div class="s">Bacheca:</div>`+nv.map(x=>`<div class="li">“${E(x.titolo)}”</div>`).join('');
 const s2=head('News dal fiume','',0)+nw.map(x=>{const im=x.img||x.immagine||x.foto;return `<div class="row"><div><b>${E(x.titolo)}</b><span>${E((x.testo||'').slice(0,40))}${(x.testo||'').length>40?'…':''}</span></div>${im?`<img src="${E(im)}">`:''}</div>`}).join('');
 const s3=head('Ultimi risultati','',0)+rs.map(x=>{const k=x.esito==='V'?'W':x.esito==='P'?'L':'D';return `<div class="row"><div><b>${E(x.avversario)}</b><span>${E(x.nostri)} – ${E(x.loro)}</span></div><div class="wl glass ${k}">${k}</div></div>`}).join('');
 return stack([['Bacheca',s1],['News dal Fiume',s2],['Ultimi Risultati',s3]])+sec();
}
/* ---------- CALENDARIO ---------- */
const LAB=t=>t==='Allenamento'?'ALL':t==='Partita'?'PAL':String(t||'').slice(0,3).toUpperCase();
function vCal(){
 const y=S.mo.getFullYear(),m=S.mo.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,td=ymd(new Date());let c='';
 for(let i=0;i<42;i++){const d=new Date(y,m,1-off+i),k=ymd(d),e=S.D.eventi.find(x=>x.data===k);
  c+=`<div class="c${d.getMonth()!==m?' o':''}${e?' ev':''}${k===td?' td':''}" ${e?`data-a="openEv" data-v="${e.id}"`:''}><span>${p2(d.getDate())}</span>${e?`<small>${E(e.ora)}<br>${LAB(e.tipo)}</small>`:''}</div>`}
 const t=new Date(),mon=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7)),a=ymd(mon),z=ymd(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6));
 const wk=tp=>{const e=S.D.eventi.find(x=>x.tipo===tp&&x.data>=a&&x.data<=z);return e?`${GG[new Date(e.data+'T12:00').getDay()]} ${e.data.slice(8)}/${e.data.slice(5,7)}`:'–'};
 return `<div class="front glass" style="padding:16px 14px;margin-bottom:12px"><div class="cm"><b>${MESI[m]} ${y}</b><span class="pill" data-a="mo" data-v="-1">−</span><span class="pill" data-a="mo" data-v="1">+</span></div><div class="cg">${c}</div></div>
 <div class="stack tp"><div class="back"><span class="lab">Coming this week…</span></div><div class="front glass" style="padding:12px 18px;font-size:14px"><b>Allenamento:</b> <span style="font-weight:300">${wk('Allenamento')}</span><br><b>Partita:</b> <span style="font-weight:300">${wk('Partita')}</span></div></div>`;
}
async function evModal(id,tab='r'){
 const e=S.D.eventi.find(x=>x.id===id);if(!e)return;
 let body='';
 if(tab==='r')body=`<div class="s">Data</div><div class="li">${dmy(e.data)}</div><div class="s">Orario</div><div class="li">${E(e.ora)}</div><div class="s">Luogo</div><div class="li">${E(e.luogo||'-')}</div><div class="s">Note</div><div class="li">${E(e.note||'-')}</div>`;
 else{
  const ps=(await getDocs(query(collection(db,"presenze"),where("eventoId","==",id)))).docs.map(d=>d.data()),v=new Set(ps.map(p=>p.username));
  let nv=[];try{nv=(await getDocs(collection(db,"utenti"))).docs.map(d=>d.data()).filter(u=>u.username&&!u.votoDisabilitato&&!v.has(u.username)).map(u=>u.nome||u.username)}catch(x){}
  const L=a=>a.length?a.map(n=>`<div class="li" style="margin:0 0 3px">${E(n)}</div>`).join(''):'<div class="li">—</div>';
  body=`<div class="two"><div><div class="s" style="margin:0 0 4px">Presenti</div>${L(ps.filter(p=>p.stato==='presente').map(p=>p.nome||p.username))}</div><div><div class="s" style="margin:0 0 4px">Assenti</div>${L(ps.filter(p=>p.stato!=='presente').map(p=>p.nome||p.username))}</div></div><div class="s">Chi non ha ancora votato:</div>${L(nv)}`;
 }
 let st=null;if(S.u){const g=await getDoc(doc(db,"presenze",id+"_"+S.u.username));if(g.exists())st=g.data().stato}
 const h=`<div class="ov" data-a="close"><div class="mc"><div class="front glass" style="margin-bottom:12px"><div class="t" style="font-size:26px;margin-bottom:10px">${E(e.tipo)}</div><div style="display:flex;gap:8px;margin-bottom:12px"><span class="pill${tab==='r'?'':' off'}" data-a="tab" data-v="${id}|r">Riepilogo</span><span class="pill${tab==='p'?'':' off'}" data-a="tab" data-v="${id}|p">Presenze</span></div><div style="min-height:230px">${body}</div></div>
 <div class="stack tp"><div class="back"><span class="lab" style="text-transform:uppercase">Il tuo voto:</span></div><div class="front glass vt"><span class="pill ok off${st==='presente'?' sel':''}" style="${st==='presente'?'':'background:rgba(255,255,255,.08)'}" data-a="vota" data-v="${id}|presente">Presente</span><span class="pill ko${st==='assente'?' sel':''}" style="${st==='assente'?'':'background:rgba(255,255,255,.08)'}" data-a="vota" data-v="${id}|assente">Assente</span></div></div></div></div>`;
 modal(h);
}
/* ---------- PROSSIMI EVENTI ---------- */
function vEv(){
 const n=S.ud.noteEventi||[];
 return stack([['',head('Eventi','In programma')+`<div class="s" style="margin-top:6px">Annota nella tua area personale</div>`+S.D.eventiExtra.map(x=>`<div class="row" style="margin-bottom:6px"><div class="li" style="margin:0">“${E(x.testo)}”</div><span data-a="pin" data-v="${x.id}" style="cursor:pointer;font-size:15px;${n.includes(x.testo)?'':'opacity:.4;filter:grayscale(1)'}">📌</span></div>`).join('')]],{nb:1})+sec();
}
/* ---------- LAVORA CON NOI ---------- */
function vJob(){
 const O=Object.fromEntries(S.D.organigramma.map(o=>[o.id,o.nomi||[]])),RL={presidente:'Presidente',tesoreria:'Tesoreria',manutenzione:'Manutenzione',dirigenti:'Dirigente'};
 const s1=head('Posizioni','Aperte')+S.D.posizioni.map(x=>`<div class="row" style="margin-bottom:10px"><div class="li" style="margin:0">“${E(x.testo)}”</div><span class="pill" data-a="cand" data-v="${x.id}">Candidati</span></div>`).join('');
 const dir=['presidente','tesoreria','manutenzione','dirigenti'].flatMap(r=>(O[r]||[]).map(n=>[n,RL[r]]));
 const s2=head('Organigramma','Dirigenti',0)+dir.map(([n,r])=>`<div class="row" style="margin-bottom:8px"><div class="li" style="margin:0">“${E(n)}”</div><span class="pill">${r}</span></div>`).join('');
 const L=a=>(a||[]).map(n=>`<div class="li" style="margin:0 0 3px">“${E(n)}”</div>`).join('')||'<div class="li">—</div>';
 const s3=head('Organigramma','Altre figure',0)+`<div class="glass" style="border-radius:14px;padding:10px 12px;margin-bottom:16px">${L(O.social)}</div><div class="s">MZ PARTY LAB:</div>${L(O.planning)}<div class="s" style="margin-top:12px">ALTRO:</div>${L(O.marketing)}`;
 const cd=S.u?S.cand.map(c=>{const k=c.stato==='accettata'?['ok','Accettata']:c.stato==='bocciata'?['ko','Bocciata']:['wt','In valutaz.'];return `<div class="row" style="margin:0 0 4px"><div class="li" style="margin:0">“${E(c.posizione)}”</div><span class="pill ${k[0]}" style="cursor:default;font-size:11px;padding:2px 12px">${k[1]}</span></div>`}).join('')||'<div class="li">Altro…</div>':'<div class="li">Accedi per vedere le tue candidature</div>';
 return stack([['Posizioni aperte e candidati',s1],['Organigramma dirigenti',s2],['Altri ruoli',s3]],{})+`<div class="stack tp"><div class="back"><span class="lab">Le tue candidature:</span></div><div class="front glass" style="padding:12px 16px">${cd}</div></div>`;
}
/* ---------- SHOP ---------- */
function vShop(){
 const pr=S.D.prodotti.filter(p=>(p.categoria||'Vestiti')===S.shopTab);
 const s1=head('Marze','Negozio')+`<div style="display:flex;gap:8px;margin-bottom:12px"><span class="pill${S.shopTab==='Vestiti'?'':' off'}" data-a="stab" data-v="Vestiti">Vestiti</span><span class="pill${S.shopTab==='Accessori'?'':' off'}" data-a="stab" data-v="Accessori">Accessori</span></div>`+pr.map(p=>`<div class="glass" style="border-radius:16px;padding:8px 10px;margin-bottom:10px;display:flex;gap:12px;align-items:center"><img src="${E(p.img)}" style="width:62px;height:62px;object-fit:cover;border-radius:10px"><div style="font-size:12px;font-weight:300"><div>“${E(p.nome)}”</div><u>“${E(p.prezzo)}€”</u><div style="font-weight:700;cursor:pointer" data-a="ottieni" data-v="${p.id}">Ottieni</div></div></div>`).join('');
 const s2=head('Marze','Negozio')+`<div class="li" style="font-size:12px">Elenco dei tuoi ordini in elaborazione</div>`+(S.u?S.ord:[]).map(o=>`<div class="glass" style="border-radius:16px;padding:10px 14px;margin-bottom:10px;font-size:13px">“${E(o.prodottoNome)}”<br><b>Q.tità: ${E(o.quantita||1)}</b> · Taglia: ${E(o.taglia)}</div>`).join('');
 return stack([['I tuoi ordini',s1],['Catalogo',s2]]);
}
/* ---------- CHI SIAMO ---------- */
function vChi(){
 return stack([['',head('Come nasce','Il progetto')+`<p class="li" style="margin:26px 12px 26px;font-size:16px">“Descrizione del nostro progetto di squadra, di come siamo nati e cosa vogliamo dal futuro”</p><img src="${TEAM}" style="width:100%;border-radius:22px;display:block;margin-bottom:10px">`]],{nx:'I tuoi ordini'});
}
/* ---------- LA TUA AREA ---------- */
function vArea(){
 const n=S.ud.noteEventi||[],A=S.ud.assets||{},un=S.msgs.filter(m=>!m.letto).length,lm=S.msgs[0];
 const s1=head('La tua area','Benvenuto '+E(S.u.nome),0)+`<div class="s" style="margin-top:22px">Presenze</div><button class="lnk" data-a="go" data-v="cal">Clicca per votare ↗</button><div class="s">Ordini</div><button class="lnk" data-a="go" data-v="shop">Clicca per vedere i tuoi ordini ↗</button><div class="s" style="margin-top:14px">Le tue note</div><div class="li" style="opacity:.75">Eventi da ricordare:</div>`+n.map(x=>`<div class="li">📌 ${E(x)}</div>`).join('');
 const d=lm?new Date(lm.timestamp):null;
 const s2=head('La tua area','Centro messaggi',0)+`<div class="s" style="margin-top:14px">Marzenego Staff:</div>`+S.msgs.slice(0,3).map(m=>`<div class="li">“${E(m.testo)}”</div>`).join('')+`<div class="s" style="margin-top:34px">Ultimo messaggio:</div><div class="li" style="margin:0">${d?`il ${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} alle ore ${p2(d.getHours())}:${p2(d.getMinutes())}`:'—'}</div><label class="ck"><input type="checkbox" data-a="letti" ${un?'':'checked'}>Segna tutti come già letti</label>`;
 const ic=(bg,svg)=>`<span style="width:46px;height:30px;border-radius:15px;background:${bg};display:grid;place-items:center">${svg}</span>`;
 const s3=head('La tua area','Link to',0)+`<div class="row" style="margin-top:24px"><div class="li" style="margin:0">Gruppo Whatsapp</div><a href="https://chat.whatsapp.com/BMPFyLqQS4kBQSHLi0UUju" target="_blank" rel="noopener">${ic('#2fa84f','💬')}</a></div><div class="row" style="margin-top:30px"><div class="li" style="margin:0">Pagina Instagram</div><a href="https://www.instagram.com/marzenego_riverside/" target="_blank" rel="noopener">${ic('linear-gradient(45deg,#f9a13b,#d6249f,#5851db)','📷')}</a></div><div class="s" style="margin-top:34px">Email:</div><div class="li">marzenegoriverside@gmail.com</div>`;
 const c=(k,t)=>`<label class="ck" style="margin:2px 4px"><input type="checkbox" data-k="${k}" ${A[k]?'checked':''}>${t}</label>`;
 const s4=head('La tua area','Assets e visita medica',0)+c('kit','Ho il kit Prima Maglia')+c('borsone','Ho il Borsone')+c('felpa','Ho la felpa Warm Up')+c('casacca','Ho una casacca')+`<div class="row" style="margin:10px 4px 6px"><b style="font-size:14px;flex:none">Numero maglia:</b><input class="in" id="nm" placeholder="#" value="${E(S.ud.numeroMaglia||'')}" style="width:56px;padding:2px 8px;margin:0;border-radius:14px;font-size:14px;text-align:center"></div><div class="s">Scadenza visita medica:</div><input class="in" id="vm" type="text" placeholder="inserisci data..." value="${E(S.ud.scadenzaVisita||'')}" onfocus="this.type='date'" style="padding:6px 12px;font-size:14px;border-radius:14px;margin:4px 0 8px"><button class="btn" data-a="salva" style="padding:8px;font-size:15px;font-weight:500">Salva</button>`;
 const s5=head('La tua area','Impostazioni',0)+`<div class="s" style="margin-top:10px">Settings</div><div class="row" style="margin-bottom:6px"><span>Notifiche</span><div class="tg"><i></i></div></div><div class="row" style="margin-bottom:6px"><span>Cambia tema app</span><button class="tc" data-a="tema"></button></div><button class="lnk" data-a="fotoBtn">Imposta foto profilo</button><button class="lnk" data-a="contratto">Leggi il contratto</button>`;
 return stack([['',s1],['',s2],['',s3],['',s4],['',s5]],{nb:1})+sec();
}
/* ---------- RENDER ---------- */
function view(){return{home:vHome,cal:vCal,ev:vEv,job:vJob,shop:vShop,chi:vChi,area:vArea}[S.page]()}
function render(){
 hdr();
 $('#nav').style.display=S.page==='area'?'none':'flex';
 $('#nav').innerHTML=PAGES.map(([k,l])=>`<button class="${k===S.page?'on':''}" data-a="go" data-v="${k}">${l}</button>`).join('');
 const nv=$('#nav'),on=$('#nav .on');if(on)nv.scrollLeft=on.offsetLeft-nv.offsetLeft-8;
 try{$('#main').innerHTML=view()}catch(e){console.error(e);$('#main').innerHTML=''}
 const sl=$('#main .sl');if(sl){const d=[...$('#main .dots')?.children||[]],nx=$('#main .nx');
  sl.addEventListener('scroll',()=>{const i=Math.round(sl.scrollLeft/sl.clientWidth);d.forEach((x,j)=>x.classList.toggle('on',j===i));if(nx&&S.names.length>1)nx.textContent='Next: '+S.names[(i+1)%S.names.length]},{passive:true})}
 $('.tc')&&($('.tc').style.background=getComputedStyle(document.documentElement).getPropertyValue('--ac'));
}
function go(p){if(p!=='area')S.prev=p;S.page=p;window.scrollTo(0,0);render()}
function modal(h){closeM();const d=document.createElement('div');d.id='mod';d.innerHTML=h;document.body.appendChild(d)}
function closeM(){$('#mod')?.remove()}
const glassCard=(h)=>modal(`<div class="ov" data-a="close"><div class="mc"><div class="front glass">${h}</div></div></div>`);
function loginM(){glassCard(`<div class="t" style="font-size:30px;margin:6px 0 14px">Login</div><input class="in" id="lu" placeholder="Username" autocapitalize="none"><input class="in" id="lp" type="password" placeholder="Password"><button class="btn" data-a="login" style="margin-top:18px">Accedi</button><label class="ck"><input type="checkbox" id="lr">Resta collegato</label>`)}
/* ---------- AZIONI ---------- */
const save=(f)=>S.uid&&updateDoc(doc(db,"utenti",S.uid),f).catch(e=>alert("Errore salvataggio: "+e.message));
const A={
 go:v=>go(v),close:()=>closeM(),
 user:()=>{if(!S.u)return loginM();go(S.page==='area'?S.prev:'area')},
 mo:v=>{S.mo=new Date(S.mo.getFullYear(),S.mo.getMonth()+ +v,1);render()},
 openEv:v=>evModal(v),tab:v=>{const[i,t]=v.split('|');evModal(i,t)},
 vota:async v=>{const[i,s]=v.split('|');if(!S.u){closeM();return loginM()}
  await setDoc(doc(db,"presenze",i+"_"+S.u.username),{eventoId:i,username:S.u.username,nome:S.u.nome,stato:s,timestamp:Date.now()});
  evModal(i,$('.pill[data-a=tab]:not(.off)')?.dataset.v.split('|')[1]||'r')},
 login:async()=>{const u=$('#lu').value.trim(),p=$('#lp').value.trim();if(!u||!p)return alert("Inserisci username e password");
  try{const s=await getDocs(query(collection(db,"utenti"),where("username","==",u),where("password","==",p)));
   if(s.empty)return alert("Credenziali errate");
   const d=s.docs[0].data(),rc=$('#lr').checked;await applyUser(d,s.docs[0].id);
   try{localStorage.removeItem(SK);sessionStorage.removeItem(SK);(rc?localStorage:sessionStorage).setItem(SK,JSON.stringify({type:"player",username:d.username,nome:d.nome,ruolo:d.ruolo||"",permissions:d.permissions||null}))}catch(e){}
   closeM();go('area')}catch(e){alert("Errore: "+e.message)}},
 pin:async v=>{if(!S.u)return loginM();const x=S.D.eventiExtra.find(e=>e.id===v),n=S.ud.noteEventi||[];
  S.ud.noteEventi=n.includes(x.testo)?n.filter(t=>t!==x.testo):[...n,x.testo];render();save({noteEventi:S.ud.noteEventi})},
 cand:async v=>{if(!S.u)return loginM();const x=S.D.posizioni.find(p=>p.id===v);
  await addDoc(collection(db,"candidature"),{nome:S.u.nome,posizione:x.testo,data:ymd(new Date())});
  S.cand=(await col('candidature')).filter(c=>c.nome===S.u.nome);render();alert("Candidatura inviata con successo!")},
 stab:v=>{S.shopTab=v;render()},
 ottieni:v=>{if(!S.u)return loginM();const p=S.D.prodotti.find(x=>x.id===v);
  glassCard(`<div class="t" style="font-size:26px;margin-bottom:12px">Ottieni articolo</div><div class="li" style="margin:0">“${E(p.nome)}”</div><u class="li">“${E(p.prezzo)}€”</u><div class="row" style="margin:8px 4px"><b style="flex:none;font-size:14px">Quantità:</b><input class="in" id="oq" type="number" min="1" value="1" style="width:64px;padding:2px 8px;margin:0;border-radius:14px;text-align:center"></div><div class="row" style="margin:8px 4px"><b style="flex:none;font-size:14px">Taglia:</b><input class="in" id="ot" placeholder="#" style="width:64px;padding:2px 8px;margin:0;border-radius:14px;text-align:center"></div><button class="btn" data-a="ordina" data-v="${v}" style="margin-top:22px">Conferma ordine</button>`)},
 ordina:async v=>{const p=S.D.prodotti.find(x=>x.id===v),t=$('#ot').value.trim();if(!t)return alert("Inserisci la taglia");
  await addDoc(collection(db,"richieste_prodotti"),{prodottoId:v,prodottoNome:p.nome,nomeUtente:S.u.nome,taglia:t,quantita:+$('#oq').value||1,data:ymd(new Date())});
  S.ord=(await col('richieste_prodotti')).filter(o=>o.nomeUtente===S.u.nome);closeM();render();alert("Richiesta inviata!")},
 letti:async()=>{for(const m of S.msgs.filter(m=>!m.letto)){await updateDoc(doc(db,"messaggi",m.id),{letto:true});m.letto=true}},
 salva:()=>{const a={};document.querySelectorAll('[data-k]').forEach(i=>a[i.dataset.k]=i.checked);
  S.ud.assets=a;S.ud.numeroMaglia=$('#nm').value.trim();S.ud.scadenzaVisita=$('#vm').value;
  save({assets:a,numeroMaglia:S.ud.numeroMaglia,scadenzaVisita:S.ud.scadenzaVisita});alert("Salvato")},
 tema:()=>glassCard(`<div class="t" style="font-size:30px">La tua area</div><div class="st" style="margin-bottom:16px">Cambia tema app</div>${TEMI.map(c=>`<div style="margin:10px 4px"><span class="tc" data-a="pickT" data-v="${c}" style="display:inline-block;background:${c};cursor:pointer;outline:${c===getComputedStyle(document.documentElement).getPropertyValue('--ac').trim()?'2px solid #fff':'0'}"></span></div>`).join('')}<button class="btn" data-a="close" style="margin-top:70px">Imposta</button>`),
 pickT:v=>{setTema(v);S.ud.tema=v;save({tema:v});A.tema()},
 fotoBtn:()=>$('#foto').click(),
 contratto:()=>glassCard(`<div class="t" style="font-size:30px">La tua area</div><div class="st" style="margin-bottom:14px">Il tuo contratto</div><div class="li" style="font-size:16px;opacity:1">Durata 1 anno<br>Premi: nessuno<br>Multe:<br>Cartellino giallo 10 euro<br>Cartellino rosso 15 euro</div><button class="btn" data-a="close" style="margin-top:110px">Torna indietro</button>`)
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='INPUT')return;if(t.classList.contains('ov')&&e.target!==t)return;A[t.dataset.a]?.(t.dataset.v)});
document.addEventListener('change',e=>{if(e.target.dataset.a==='letti'&&e.target.checked)A.letti()});
$('#foto').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
 const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),m=Math.min(i.width,i.height);x.drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,160,160);
 S.ud.fotoProfilo=c.toDataURL('image/jpeg',.8);save({fotoProfilo:S.ud.fotoProfilo});render()};i.src=r.result};r.readAsDataURL(f)});
/* ---------- AVVIO ---------- */
(async()=>{
 let ss=null;try{ss=JSON.parse(localStorage.getItem(SK)||sessionStorage.getItem(SK)||'null')}catch(e){}
 render();
 if(ss&&ss.type==="player"&&ss.username){try{const s=await getDocs(query(collection(db,"utenti"),where("username","==",ss.username)));if(!s.empty)await applyUser(s.docs[0].data(),s.docs[0].id)}catch(e){}}
 await loadAll();render();
})();
</script>
</body>
</html>
